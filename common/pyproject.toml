[project]
name = "mvx-common"
version = "0.2.2rc1"
description = "Common utilities for MVX Python packages."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Vladimir Makarov" }
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
]

[project.urls]
Documentation = "https://mvx-lib.readthedocs.io/en/latest/"
Source = "https://github.com/makarovvvdream-dev/mvx-lib"
Issues = "https://github.com/makarovvvdream-dev/mvx-lib/issues"
Changelog = "https://mvx-lib.readthedocs.io/en/latest/common/version_history/"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]
docs = [
    "Sphinx<9",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "enum-tools[sphinx]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "F841",
  "S101",
  "SLF001",
  "PLR2004",
  "D",
  "ANN",
  "ARG001",
]

[tool.coverage.run]
branch = true
source = ["src/mvx/common"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]